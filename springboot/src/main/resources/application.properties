# Puerto distinto al 8080 de Tomcat
server.port=${SERVER_PORT:8081}

# Credenciales por variables de entorno: NUNCA escribir la contrasena aqui
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ESCUELA}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# La base se crea con sql/Escuela.sql; Hibernate no modifica el esquema
spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres EN MAYUSCULAS de tablas y columnas (MySQL en Linux distingue mayusculas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Muestra el mensaje de error (404, 400...) en las respuestas JSON
server.error.include-message=always
